<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --navy: #13233f; --ink: #1b2a44; --blue: #1d4fd8; --sky: #38bdf8; --water: #22b8d8;
    --pale: #dbeafe; --grey: #d5dbe5; --paper: #f5f7fb; --red: #c8102e; --amber: #f59e0b;
    --green: #16a34a; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(rgba(19,35,63,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(19,35,63,.045) 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Inter", sans-serif; font-stretch: condensed; }
  .mono { font-family: "IBM Plex Mono", "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }

  /* ---------- frame ---------- */
  header { position: absolute; left: 0; right: 0; top: 0; height: 120px; padding: 34px 64px 0; }
  header h1 { font-size: 62px; font-weight: 800; color: var(--navy); letter-spacing: -.5px; line-height: 1; }
  header .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--blue); opacity: .55;
                 transform-origin: left; }
  .chip { position: absolute; right: 64px; top: 38px; background: var(--blue); color: #fff; font-size: 26px;
          font-weight: 700; padding: 6px 16px; border-radius: 6px; letter-spacing: .5px; }
  .chip.safety { background: var(--red); }
  main { position: absolute; left: 64px; right: 64px; top: 160px; bottom: 150px; }
  .caption { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); max-width: 1500px;
             background: var(--ink); color: #fff; font-size: 32px; line-height: 1.3; padding: 12px 26px;
             border-radius: 4px; text-align: center; }

  /* ---------- animation vocabulary (also usable inside custom SVG) ---------- */
  .appear, .pop, .slide-l, .slide-r, .drop-in, .fade { animation-duration: .6s; animation-delay: var(--d, 0s);
     animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  .appear  { animation-name: appear; }
  .fade    { animation-name: fade; }
  .pop     { animation-name: pop; transform-box: fill-box; transform-origin: center; }
  .slide-l { animation-name: slide-l; }
  .slide-r { animation-name: slide-r; }
  .drop-in { animation-name: drop-in; transform-box: fill-box; }
  @keyframes appear  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop     { 0% { opacity: 0; transform: scale(.7); } 70% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes slide-l { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
  @keyframes slide-r { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-80px); } to { opacity: 1; transform: none; } }

  /* lines that draw themselves: give the path pathLength="1" */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--dur, 1s) ease-in-out var(--d, 0s) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* liquid / current flowing along a path (pathLength="1") */
  .flow { stroke-dasharray: .03 .03; animation: flow 1s linear var(--d, 0s) infinite; }
  @keyframes flow { to { stroke-dashoffset: -.06; } }
  /* a rect that fills from the bottom (water level) */
  .fill-up { transform-box: fill-box; transform-origin: bottom; animation: fill-up var(--dur, 2s) ease-in-out var(--d, 0s) both; }
  @keyframes fill-up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  /* the opposite: a level going down (emptying) */
  .drain { transform-box: fill-box; transform-origin: bottom; animation: drain var(--dur, 1.2s) ease-in var(--d, 0s) both; }
  @keyframes drain { from { transform: scaleY(1); } to { transform: scaleY(0); } }
  /* drops falling, repeat */
  .drip { animation: drip 1s ease-in var(--d, 0s) infinite; transform-box: fill-box; }
  @keyframes drip { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(var(--fall, 120px)); } }
  .pulse { animation: pulse 1.4s ease-in-out var(--d, 0s) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .blink { animation: blink 1s steps(2, jump-none) var(--d, 0s) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .spin { animation: spin var(--dur, 3s) linear var(--d, 0s) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shake { animation: shake .5s ease-in-out var(--d, 0s) 4 both; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .mist { animation: mist 1.2s ease-out var(--d, 0s) infinite; transform-box: fill-box; transform-origin: left center; }
  @keyframes mist { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: .9; } 100% { opacity: 0; transform: scale(1.4); } }
  .progress { transform-box: fill-box; transform-origin: left; animation: progress var(--dur, 3s) linear var(--d, 0s) both; }
  @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .move { animation: move var(--dur, 1.2s) ease-in-out var(--d, 0s) both; }
  @keyframes move { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 0px), var(--dy, 0px)); } }

  /* ---------- layouts ---------- */
  .title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .title-wrap h2 { font-size: 104px; font-weight: 800; color: var(--navy); line-height: 1.02; max-width: 1500px; }
  .title-wrap .sub { margin-top: 30px; font-size: 38px; color: var(--blue); font-weight: 600; }
  .title-wrap .bar { margin-top: 34px; width: 180px; height: 8px; background: var(--sky); border-radius: 4px; transform-origin: center; }

  .grid { display: flex; flex-wrap: wrap; gap: 34px; padding-top: 10px; }
  .card { width: 540px; height: 200px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 10px;
          display: flex; align-items: center; gap: 24px; padding: 18px 26px; box-shadow: 0 6px 0 rgba(19,35,63,.08); }
  .card .ico { width: 140px; height: 150px; flex: none; display: flex; align-items: center; justify-content: center; }
  .card .ico svg { width: 130px; height: 130px; }
  .card .ico img { max-width: 140px; max-height: 150px; object-fit: contain; border-radius: 6px; }
  .card b { display: block; font-size: 34px; color: var(--navy); line-height: 1.1; }
  .card span { display: block; margin-top: 8px; font-size: 24px; color: #4b5b75; line-height: 1.25; }
  .card.hot { border-color: var(--blue); box-shadow: 0 0 0 5px var(--pale); }

  .warns { display: flex; flex-direction: column; gap: 26px; padding-top: 20px; }
  .warn { background: var(--red); color: #fff; font-size: 40px; font-weight: 700; padding: 16px 30px; border-radius: 8px;
          display: flex; align-items: center; gap: 22px; }
  .warn svg { width: 46px; height: 46px; flex: none; }

  .checks { display: flex; flex-direction: column; gap: 34px; padding: 30px 0 0 40px; }
  .check { display: flex; align-items: center; gap: 30px; font-size: 52px; font-weight: 700; color: var(--navy); }
  .check svg { width: 76px; height: 76px; flex: none; }
  .check .num { font-size: 30px; color: var(--blue); font-weight: 800; width: 76px; text-align: center; }

  .split { position: absolute; inset: 0; display: flex; align-items: center; gap: 60px; }
  .stage { flex: none; width: 1180px; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .stage svg.diagram { width: 100%; height: 100%; }
  .stage:only-child { width: 100%; flex: 1; }
  .notes { flex: 1; align-self: flex-start; padding-top: 30px; }
  .notes h3 { font-size: 44px; font-weight: 800; color: var(--navy); margin-bottom: 18px; }
  .notes li { list-style: none; font-size: 32px; color: #4b5b75; line-height: 1.3; margin-bottom: 16px; display: flex; gap: 12px; }
  .notes li i { font-style: normal; color: var(--blue); font-weight: 800; }

  .photo { position: relative; width: 1100px; height: 740px; background: #fff; border: 2.5px solid var(--ink);
           border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .photo img { max-width: 96%; max-height: 96%; object-fit: contain; animation: kenburns var(--dur, 8s) ease-in-out both; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
  .panel3d { width: 1100px; height: 740px; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; }

  .status { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font-size: 24px; font-weight: 700;
            padding: 7px 18px; border-radius: 22px; display: flex; gap: 10px; align-items: center; z-index: 2; }
  .status.on { background: var(--blue); }
  .tag3d { position: absolute; left: 20px; top: 20px; background: var(--blue); color: #fff; font-size: 22px; font-weight: 800; padding: 4px 12px; border-radius: 6px; z-index: 3; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs id="icon-defs"></defs>
</svg>
<header><h1 class="cond slide-l" id="title"></h1><div class="chip mono fade" id="chip"></div><div class="rule" id="rule"></div></header>
<main id="main"></main>
<div class="caption appear" id="caption" style="--d:.3s"></div>

<script>
/* ---------------- icons (64x64 line art, navy stroke, blue accents) ---------------- */
const S = 'stroke="#1b2a44" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"';
const ICONS = {
  bottle: `<rect x="22" y="6" width="20" height="8" rx="2" fill="#1d4fd8" ${S}/><path d="M24 14h16v8l6 6v30a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V28l6-6z" fill="#fff" ${S}/><path d="M19 38h26v19a2 2 0 0 1-2 2H21a2 2 0 0 1-2-2z" fill="#9fd3f5"/><path d="M24 14h16v8l6 6v30a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V28l6-6z" fill="none" ${S}/>`,
  sterile_bottle: `<rect x="20" y="6" width="24" height="9" rx="2" fill="#16a34a" ${S}/><rect x="16" y="15" width="32" height="44" rx="5" fill="#fff" ${S}/><path d="M16 40h32" stroke="#1d4fd8" stroke-width="2" stroke-dasharray="3 3"/><path d="M32 24v10M27 29h10" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>`,
  spray: `<path d="M22 8h14l6 6h8v6H38l-4 4H24z" fill="#1d4fd8" ${S}/><path d="M24 24h12v6l4 4v24a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3V34l4-4z" fill="#fff" ${S}/><rect x="22" y="40" width="16" height="10" rx="1" fill="#9fd3f5"/><circle cx="56" cy="12" r="1.6" fill="#38bdf8"/><circle cx="58" cy="18" r="1.6" fill="#38bdf8"/><circle cx="55" cy="23" r="1.6" fill="#38bdf8"/>`,
  wipes: `<path d="M8 30h48v22a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#1d4fd8" ${S}/><path d="M8 30l8-8h32l8 8" fill="#3b6fe8" ${S}/><path d="M26 30c-2-10 4-18 6-22 4 6 8 12 6 22" fill="#fff" ${S}/>`,
  gloves: `<path d="M22 60V36l-6-12a3 3 0 0 1 5-3l5 9V10a3 3 0 0 1 6 0v18-22a3 3 0 0 1 6 0v22-18a3 3 0 0 1 6 0v20-14a3 3 0 0 1 6 0v28c0 8-4 12-8 14v4z" fill="#8ea8f0" ${S}/>`,
  marker: `<path d="M14 50l26-26 8 8-26 26H14z" fill="#1b2a44" ${S}/><path d="M40 24l6-6 8 8-6 6z" fill="#1d4fd8" ${S}/><path d="M14 50l-4 8 8-4" fill="#1b2a44" ${S}/>`,
  coolbox: `<rect x="8" y="22" width="48" height="34" rx="4" fill="#1d4fd8" ${S}/><rect x="6" y="16" width="52" height="10" rx="3" fill="#fff" ${S}/><path d="M22 16v-6h20v6" fill="none" ${S}/><path d="M32 33v14M26 36l12 8M38 36l-12 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`,
  clipboard: `<rect x="12" y="10" width="40" height="50" rx="4" fill="#fff" ${S}/><rect x="22" y="6" width="20" height="9" rx="2" fill="#1d4fd8" ${S}/><path d="M20 28h24M20 37h24M20 46h16" stroke="#1b2a44" stroke-width="2.4" stroke-linecap="round"/>`,
  thermometer: `<path d="M26 40V12a6 6 0 0 1 12 0v28a11 11 0 1 1-12 0z" fill="#fff" ${S}/><circle cx="32" cy="49" r="6" fill="#38bdf8"/><rect x="30" y="20" width="4" height="26" fill="#38bdf8"/><path d="M42 16h6M42 24h6M42 32h6" stroke="#1b2a44" stroke-width="2.2" stroke-linecap="round"/>`,
  clock: `<circle cx="32" cy="34" r="24" fill="#fff" ${S}/><path d="M32 20v14l10 6" fill="none" ${S}/><path d="M26 6h12" ${S}/>`,
  tap: `<rect x="6" y="14" width="18" height="16" rx="2" fill="#d5dbe5" ${S}/><path d="M24 18h22a8 8 0 0 1 8 8v8h-10v-6H24z" fill="#fff" ${S}/><rect x="30" y="8" width="10" height="10" rx="2" fill="#1d4fd8" ${S}/><path d="M49 40c0 4-3 6-3 8a3 3 0 0 0 6 0c0-2-3-4-3-8z" fill="#38bdf8"/>`,
  cup: `<path d="M14 16h36l-5 42a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3z" fill="#fff" ${S}/><path d="M16 30h32l-3 26a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3z" fill="#9fd3f5"/>`,
  syringe: `<rect x="12" y="26" width="34" height="12" rx="2" fill="#fff" ${S}/><rect x="14" y="28" width="16" height="8" fill="#9fd3f5"/><path d="M46 32h10M4 32h8M4 25v14M18 26v-4M26 26v-4M34 26v-4" ${S} fill="none"/>`,
  tube: `<path d="M10 56c0-16 10-20 20-20s18-6 18-16-8-14-16-14-14 6-14 12 6 10 10 10" fill="none" stroke="#22b8d8" stroke-width="6" stroke-linecap="round"/>`,
  meter: `<rect x="20" y="4" width="24" height="56" rx="6" fill="#16a34a" ${S}/><rect x="24" y="10" width="16" height="14" rx="2" fill="#e8f5e9" ${S}/><circle cx="32" cy="34" r="3" fill="#fff"/><circle cx="32" cy="44" r="3" fill="#fff"/>`,
  key: `<path d="M14 10h36l-8 10v8H22v-8z" fill="#d5dbe5" ${S}/><rect x="24" y="28" width="16" height="26" rx="2" fill="#d5dbe5" ${S}/><path d="M28 46l4-6 4 6z" fill="#1b2a44"/>`,
  phone: `<rect x="18" y="4" width="28" height="56" rx="5" fill="#fff" ${S}/><rect x="22" y="12" width="20" height="36" rx="1" fill="#9fd3f5"/><circle cx="32" cy="54" r="2" fill="#1b2a44"/>`,
  bucket: `<path d="M10 22h44l-6 36H16z" fill="#fff" ${S}/><path d="M12 22c0-14 40-14 40 0" fill="none" ${S}/><path d="M14 40h36l-3 18H17z" fill="#9fd3f5"/>`,
  filter: `<rect x="20" y="6" width="24" height="52" rx="6" fill="#4b5563" ${S}/><path d="M20 20h24M20 32h24M20 44h24" stroke="#9ca3af" stroke-width="2"/>`,
  hands: `<path d="M8 40c6-2 12-10 16-16 2-3 6-1 4 2l-4 8h22c3 0 3 4 0 4H32h14c3 0 3 4 0 4H34h10c3 0 3 4 0 4H24c-8 0-12-2-16-4z" fill="#fde7d4" ${S}/><path d="M40 8c0 4-3 6-3 8a3 3 0 0 0 6 0c0-2-3-4-3-8zM52 14c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z" fill="#38bdf8"/>`,
  power: `<path d="M22 18a18 18 0 1 0 20 0" fill="none" stroke="#1b2a44" stroke-width="4" stroke-linecap="round"/><path d="M32 8v22" stroke="#c8102e" stroke-width="4.5" stroke-linecap="round"/>`,
  label: `<path d="M8 20h34l14 12-14 12H8z" fill="#fff" ${S}/><circle cx="42" cy="32" r="3" fill="#1b2a44"/><path d="M14 28h18M14 36h12" stroke="#1d4fd8" stroke-width="2.4" stroke-linecap="round"/>`,
  drop: `<path d="M32 6C26 18 16 28 16 40a16 16 0 0 0 32 0c0-12-10-22-16-34z" fill="#38bdf8" ${S}/>`,
  box: `<path d="M8 22l24-12 24 12v24L32 58 8 46z" fill="#e7c9a0" ${S}/><path d="M8 22l24 12 24-12M32 34v24" fill="none" ${S}/>`,
  warning: `<path d="M32 6l28 50H4z" fill="#fff" stroke="#fff" stroke-width="2"/><path d="M32 22v16M32 46v2" stroke="#c8102e" stroke-width="5" stroke-linecap="round"/>`,
  check: `<circle cx="32" cy="32" r="28" fill="#fff" stroke="#1d4fd8" stroke-width="4"/><path d="M19 33l9 9 18-19" fill="none" stroke="#1d4fd8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
};
document.getElementById('icon-defs').innerHTML = Object.entries(ICONS)
  .map(([k, v]) => `<symbol id="i-${k}" viewBox="0 0 64 64">${v}</symbol>`).join('');
const icon = (name, cls = '') => ICONS[name]
  ? `<svg viewBox="0 0 64 64" class="${cls}">${ICONS[name]}</svg>`
  : `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#dbeafe" stroke="#1b2a44" stroke-width="2.6"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- machine schematic from a parts list ---------------- */
function machineSVG(parts, highlight, name) {
  const kind = p => {
    const s = p.toLowerCase();
    if (/(écran|ecran|screen|display)/.test(s)) return 'screen';
    if (/(bec|spout|tap|robinet|nozzle|dispens|outlet|sortie)/.test(s)) return 'tap';
    if (/(porte|door)/.test(s)) return 'door';
    if (/(trappe|hatch|panel|panneau|tableau|électrique|electrique)/.test(s)) return 'panel';
    if (/(filtre|filter)/.test(s)) return 'filter';
    return 'block';
  };
  const H = { screen: 92, tap: 150, door: 210, panel: 112, filter: 130, block: 112 };
  const W = 330, X = 40, gap = 26;
  let y = 30, out = '', callouts = '', hi = '';
  parts.forEach((p, i) => {
    const k = kind(p), h = H[k], d = (0.25 + i * 0.25).toFixed(2);
    const isHot = highlight && p.toLowerCase() === String(highlight).toLowerCase();
    let inner = '';
    if (k === 'screen') inner = `<rect x="${X+70}" y="${y+14}" width="${W-140}" height="${h-28}" rx="6" fill="#4b5b75"/><text x="${X+W/2}" y="${y+h/2+8}" text-anchor="middle" fill="#cbd5e1" font-size="26">•••</text>`;
    if (k === 'tap') inner = `<rect x="${X+80}" y="${y+18}" width="${W-160}" height="${h-36}" rx="6" fill="#fff" stroke="#1b2a44" stroke-width="3"/><path d="M${X+W/2-10} ${y+18}v36h20v-36" fill="#d5dbe5" stroke="#1b2a44" stroke-width="3"/>`;
    if (k === 'door') inner = `<path d="M${X+W-50} ${y+h/2-30}v60" stroke="#1b2a44" stroke-width="5" stroke-linecap="round"/>`;
    if (k === 'panel') inner = `<path d="M${X+W-60} ${y+h/2-18}v36" stroke="#1b2a44" stroke-width="4" stroke-linecap="round"/>`;
    if (k === 'filter') inner = `<rect x="${X+W/2-22}" y="${y+14}" width="44" height="${h-28}" rx="8" fill="#4b5563"/>`;
    out += `<g class="appear" style="--d:${d}s"><rect x="${X+20}" y="${y}" width="${W-40}" height="${h}" rx="8" fill="${isHot ? '#dbeafe' : '#fff'}" stroke="#1b2a44" stroke-width="3"/>${inner}</g>`;
    const cy = y + h / 2;
    callouts += `<g class="fade" style="--d:${(+d + .3).toFixed(2)}s"><path d="M${X+W-20} ${cy}H${X+W+70}" stroke="#1b2a44" stroke-width="2.5"/><text x="${X+W+82}" y="${cy+11}" font-size="32" font-weight="${isHot ? 800 : 600}" fill="${isHot ? '#1d4fd8' : '#1b2a44'}">${esc(p)}</text></g>`;
    if (isHot) hi = `<ellipse cx="${X+W/2}" cy="${cy}" rx="${W/2+34}" ry="${h/2+34}" fill="none" stroke="#1d4fd8" stroke-width="8" pathLength="1" class="draw" style="--d:${(0.6 + parts.length*0.25).toFixed(2)}s;--dur:1s"/>`;
    y += h + gap;
  });
  const total = y + 10;
  const body = `<rect x="${X}" y="10" width="${W}" height="${total - 10}" rx="16" fill="#d5dbe5" stroke="#1b2a44" stroke-width="4" class="fade"/>`;
  const label = name ? `<text x="${X+W/2}" y="${total + 50}" text-anchor="middle" font-size="30" font-weight="800" fill="#1b2a44" class="fade" style="--d:.4s">${esc(name)}</text>` : '';
  return `<svg class="diagram" viewBox="0 0 900 ${total + 70}" preserveAspectRatio="xMidYMid meet">${body}${out}${callouts}${hi}${label}</svg>`;
}

/* ---------------- sanitise custom SVG (diagram layout) ---------------- */
function cleanSVG(svg) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(svg || '');
  tpl.content.querySelectorAll('script, foreignObject, iframe, image[href^="http"], a').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name) || /javascript:|https?:/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
  let el = tpl.content.querySelector('svg');
  if (!el) return '';
  el.classList.add('diagram');
  if (!el.getAttribute('viewBox')) el.setAttribute('viewBox', '0 0 1200 700');
  el.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  el.removeAttribute('width'); el.removeAttribute('height');
  return el.outerHTML;
}

/* ---------------- build a scene ---------------- */
function notesHTML(sc, d0) {
  if (!sc.bullets || !sc.bullets.length) return '';
  const lis = sc.bullets.map((b, i) => `<li class="appear" style="--d:${(d0 + i * 0.7).toFixed(2)}s"><i>${i + 1}.</i>${esc(b)}</li>`).join('');
  return `<div class="notes">${sc.notes_title ? `<h3 class="cond appear" style="--d:${(d0 - .3).toFixed(2)}s">${esc(sc.notes_title)}</h3>` : ''}<ul>${lis}</ul></div>`;
}
function statusHTML(sc, L) {
  if (!sc.power) return '';
  const on = sc.power === 'on';
  return `<div class="status mono pop ${on ? 'on' : ''}" style="--d:.2s">⏻ ${esc(on ? L.power_on : L.power_off)}</div>`;
}

window.render = function (sc) {
  const L = Object.assign({ intro: 'Introduction', safety: 'Safety', method: 'Method', step: 'Step',
                            power_off: 'Power off', power_on: 'Power on' }, sc.labels || {});
  document.getElementById('title').textContent = sc.kind === 'title' ? '' : sc.heading;
  const chip = document.getElementById('chip');
  const chipText = sc.chip || ({ title: '', overview: L.intro, materials: L.intro, warning: L.safety,
                                 summary: L.method }[sc.kind] ?? (sc.step_number ? `${L.step} ${sc.step_number}/${sc.total_steps}` : L.method));
  chip.textContent = chipText; chip.style.display = chipText ? '' : 'none';
  chip.className = 'chip mono fade' + (sc.kind === 'warning' ? ' safety' : '');
  document.querySelector('header').style.display = sc.kind === 'title' ? 'none' : '';
  const cap = document.getElementById('caption');
  cap.textContent = sc.narration || ''; cap.style.display = sc.narration ? '' : 'none';

  const main = document.getElementById('main');
  const layout = sc.layout || 'checklist';
  let html = '';
  if (layout === 'title') {
    html = `<div class="title-wrap"><h2 class="cond appear" style="--d:.2s">${esc(sc.heading)}</h2>`
         + (sc.bullets?.[0] ? `<div class="sub appear" style="--d:.7s">${esc(sc.bullets[0])}</div>` : '')
         + `<div class="bar pop" style="--d:1.1s"></div></div>`;
  } else if (layout === 'items') {
    html = `<div class="grid">` + (sc.items || []).map((it, i) => {
      const vis = it.image_url ? `<img src="${it.image_url}">` : icon(it.icon);
      return `<div class="card pop" style="--d:${(0.3 + i * 0.45).toFixed(2)}s"><div class="ico">${vis}</div><div><b class="cond">${esc(it.label)}</b>${it.detail ? `<span>${esc(it.detail)}</span>` : ''}</div></div>`;
    }).join('') + `</div>`;
  } else if (layout === 'warnings') {
    html = `<div class="warns">` + (sc.bullets || []).map((b, i) =>
      `<div class="warn slide-l" style="--d:${(0.3 + i * 0.9).toFixed(2)}s"><svg viewBox="0 0 64 64">${ICONS.warning}</svg>${esc(b)}</div>`).join('') + `</div>`;
  } else if (layout === 'machine') {
    html = `<div class="split"><div class="stage">${statusHTML(sc, L)}${machineSVG(sc.machine_parts || [], sc.highlight, sc.machine_name)}</div>${notesHTML(sc, 1.2 + (sc.machine_parts || []).length * 0.25)}</div>`;
  } else if (layout === 'diagram') {
    html = `<div class="split"><div class="stage">${statusHTML(sc, L)}${cleanSVG(sc.svg)}</div>${notesHTML(sc, 0.8)}</div>`;
  } else if (layout === 'media') {
    const vis = sc.has3d ? `<div class="panel3d fade" id="panel3d"><div class="tag3d">3D</div></div>`
      : `<div class="photo fade" style="--dur:${sc.duration || 8}s"><img src="${sc.image_url}"></div>`;
    html = `<div class="split"><div class="stage">${statusHTML(sc, L)}${vis}</div>${notesHTML(sc, 0.8)}</div>`;
  } else { /* checklist */
    html = `<div class="checks">` + (sc.bullets || []).map((b, i) => {
      const d = 0.4 + i * 1.0;
      return `<div class="check appear" style="--d:${d.toFixed(2)}s"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#fff" stroke="#1d4fd8" stroke-width="4"/><path d="M19 33l9 9 18-19" fill="none" stroke="#1d4fd8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--d:${(d + .45).toFixed(2)}s;--dur:.5s"/></svg>${esc(b)}</div>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;

  // pause everything; Python steps time with setTime()
  window.setTime(0);
  // end of the last finite animation, so the clip lasts long enough
  let end = 0;
  for (const a of document.getAnimations()) {
    const t = a.effect.getComputedTiming();
    if (t.iterations !== Infinity && isFinite(t.endTime)) end = Math.max(end, t.endTime / 1000);
  }
  const p = document.getElementById('panel3d');
  const rect = p ? p.getBoundingClientRect() : null;
  return { end, panel: rect ? { x: rect.x, y: rect.y, w: rect.width, h: rect.height } : null };
};

window.setTime = function (t) {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
  document.querySelectorAll('svg').forEach(s => { try { s.pauseAnimations(); s.setCurrentTime(t); } catch (e) {} });
};
</script>
</body>
</html>
