[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protovid"
version = "0.1.0"
description = "Turn a Word (.docx) protocol into a narrated step-by-step video"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.7,<3",
  "python-docx>=1.1",
  "pillow>=10",
  "gTTS>=2.5",
  "numpy>=1.26",
  "playwright>=1.45",   # motion style: run `playwright install chromium` once
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
3d = [
  "trimesh>=4.5",
  "pyvista>=0.44",
  "cascadio>=0.0.13",   # reads STEP files
]

[project.scripts]
protovid = "protovid.cli:main"
protovid-web = "protovid.web.app:main"

[tool.setuptools]
packages = ["protovid", "protovid.motion", "protovid.web"]

[tool.setuptools.package-data]
"protovid.motion" = ["template.html"]
"protovid.web" = ["index.html"]
