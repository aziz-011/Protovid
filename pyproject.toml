[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protovid"
version = "0.1.0"
description = "Turn a Word (.docx) protocol into a narrated step-by-step video"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.7,<3",
  "python-docx>=1.1",
  "pillow>=10",
  "gTTS>=2.5",
]

[project.scripts]
protovid = "protovid.cli:main"

[tool.setuptools]
packages = ["protovid"]
